<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="contatos.css">

   <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>


 
<body>

<div class="logo-loader">

    <div class="circulo-logo"></div>

    <span>ABYSSAL DIVE</span>

  </div>



  <header>

    <nav>

      <a href="index.html">Início</a>

      <a href="destinos.html">Destinos</a>

      <a href="contatos.html">Contatos</a>

    </nav>

  </header>



  <section class="banner">

    <div class="overlay"></div>

    <div class="banner-texto">

      <h1>CONTATOS</h1>

      <p>
        Entre em contato conosco para mais informações.
      </p>

    </div>

  </section>

  

<section class="contato-container">



  <div class="card-contato">

    <h1>Agende Seu Mergulho</h1>

    <p>
      Explore os oceanos mais incríveis do planeta.
    </p>

    <form>

      <div class="campo">

        <label>Destino</label>

        <select>

          <option>Maldivas</option>

          <option>Fernando de Noronha</option>

          <option>Austrália</option>

          <option>Tailândia</option>

          <option>Havaí</option>

          <option>Filipinas</option>

        </select>

      </div>

      <div class="campo">

        <label>Nome</label>

        <input type="text"
        placeholder="Digite seu nome">

      </div>

      <div class="campo">

        <label>Contato</label>

        <input type="text"
        placeholder="(11) 99999-9999">

      </div>

      <button type="submit">
        AGENDAR
      </button>

    </form>

  </div>

  

  <div class="card-contato">

    <h1>Solicite Suas Fotos</h1>

    <p>
      Reviva seus melhores mergulhos.
    </p>

    <form>

      <div class="campo">

        <label>Destino</label>

        <select>

          <option>Maldivas</option>

          <option>Fernando de Noronha</option>

          <option>Austrália</option>

          <option>Tailândia</option>

          <option>Havaí</option>

          <option>Filipinas</option>

        </select>

      </div>

      <div class="campo">

        <label>Nome</label>

        <input type="text"
        placeholder="Digite seu nome">

      </div>

      <div class="campo">

        <label>Email</label>

        <input type="email"
        placeholder="seuemail@gmail.com">

      </div>

      <button type="submit">
        SOLICITAR
      </button>

    </form>

  </div>

</section>

  </body>
</html>
